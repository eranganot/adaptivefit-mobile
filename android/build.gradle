// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Phase 7: rewrite legacy proguard-android.txt → proguard-android-optimize.txt
// in every Capacitor plugin at evaluation time. See proguard-fix.gradle for
// rationale. Replaces the per-plugin node_modules edits we previously had to
// re-apply after every `pnpm install`.
apply from: "proguard-fix.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
