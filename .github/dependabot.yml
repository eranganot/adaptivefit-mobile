version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need a deliberate upgrade; Dependabot opens only minor/patch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Node runtime is 22 (.nvmrc / engines); keep its types on the same line.
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
