# Railway service config — committed to repo so deploys are reproducible.
# Reference: https://docs.railway.com/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm build"

[deploy]
# Run pending migrations (non-interactive). Replaces `drizzle-kit push` which
# prompts and hangs in non-TTY environments.
preDeployCommand = "pnpm db:migrate"
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
